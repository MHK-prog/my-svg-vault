<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVG Vault</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b1220" />
  <style>
    :root {
      --bg: #0b1220; --card: #111f38; --text: #eaf0ff; --muted: #9fb0d0;
      --brand: #5dd6ff; --danger: #ff5d7a; --ok: #5dffb1; --border: rgba(255,255,255,.08);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 40px;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 15px; }
    header {
      position: sticky; top: 0; background: rgba(11,18,32,0.9);
      backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); z-index: 10;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    nav { display: flex; gap: 8px; align-items: center; }
    .btn {
      border: 1px solid var(--border); background: rgba(255,255,255,.05);
      color: var(--text); padding: 8px 14px; border-radius: var(--radius);
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    }
    .btn:hover { background: rgba(255,255,255,.1); }
    .btn.primary { background: #0070f3; border-color: #0070f3; color: #fff; font-weight: bold; }
    .btn.danger { background: rgba(255,93,122,.15); border-color: var(--danger); color: var(--danger); }
    
    .panel { background: rgba(15,26,46,.75); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 15px; }
    .grid { display: grid; gap: 12px; }
    .grid.cols-3 { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .grid.cols-4 { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
    .card .thumb {
      height: 90px; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.02); border-radius: 8px; margin-bottom: 8px;
    }
    .card .thumb svg { max-width: 50px; max-height: 50px; fill: currentColor; }
    .input, .select, textarea {
      width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: rgba(255,255,255,.05); color: var(--text); outline: none; margin-top: 4px;
    }
    textarea { height: 140px; font-family: monospace; font-size: 12px; }
    
    /* مودال */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: none; align-items: center; justify-content: center; padding: 15px; z-index: 50;
    }
    .modal-backdrop.show { display: flex; }
    .modal { background: #0f1a2e; border: 1px solid var(--border); border-radius: var(--radius); width: min(550px, 100%); padding: 20px; }
    
    .toast {
      position: fixed; bottom: 20px; left: 20px; background: #0070f3; color: white;
      padding: 10px 18px; border-radius: 8px; display: none; z-index: 60; font-size: 13px;
    }
    .toast.show { display: block; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: rgba(255,255,255,.08); color: var(--muted); }
  </style>
</head>
<body>

<header>
  <div class="wrap topbar">
    <div><b>SVG Vault</b></div>
    <nav>
      <a class="btn" href="#/dashboard" id="navDash">داشبورد (دسته‌ها)</a>
      <a class="btn" href="#/vault" id="navVault">مشاهده SVGها</a>
      <button class="btn primary" id="btnOpenAdd">+ SVG جدید</button>
      <button class="btn" id="btnSettings">تنظیمات گیت‌هاب</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<!-- مودال ثبت SVG -->
<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <h3 style="margin-top:0">افزودن SVG جدید</h3>
    <label>نام آیکون: <input class="input" id="addName" placeholder="مثلاً: icon-user" /></label>
    <div style="margin-top:10px">
      <label>دسته‌بندی: <select class="select" id="addCategory"></select></label>
    </div>
    <div style="margin-top:10px">
      <label>کد SVG: <textarea id="addCode" placeholder="<svg ...>...</svg>"></textarea></label>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:15px">
      <button class="btn primary" id="btnSaveSvg">ذخیره و همگام‌سازی با گیت‌هاب</button>
      <button class="btn" onclick="toggleModal('addModal', false)">انصراف</button>
    </div>
  </div>
</div>

<!-- مودال تنظیمات GitHub -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <h3 style="margin-top:0">اتصال ضد‌گلوله به ریپازیتوری GitHub</h3>
    <p style="font-size:12px; color:var(--muted)">با تنظیم توکن، اطلاعاتت روی خود گیت‌هاب ثبت می‌شن و تا ابد امن می‌مونن.</p>
    <label>GitHub Repo (فرمت: username/repo): <input class="input" id="ghRepo" placeholder="mohammad/my-svgs" /></label>
    <div style="margin-top:10px">
      <label>Personal Access Token (با دسترسی repo): <input type="password" class="input" id="ghToken" placeholder="ghp_xxxx" /></label>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:15px">
      <button class="btn primary" id="btnSaveSettings">ذخیره تنظیمات و دریافت اطلاعات</button>
      <button class="btn" onclick="toggleModal('settingsModal', false)">بستن</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// مدل داده‌ها (KISS)
let db = {
  categories: JSON.parse(localStorage.getItem('cats')) || ["عمومی"],
  svgs: JSON.parse(localStorage.getItem('svgs')) || []
};

let ghConfig = JSON.parse(localStorage.getItem('gh_config')) || { repo: '', token: '' };
let fileSha = null; // برای آپدیت فایل در GitHub

function toast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function toggleModal(id, show) {
  document.getElementById(id).classList.toggle('show', show);
}

function saveLocal() {
  localStorage.setItem('cats', JSON.stringify(db.categories));
  localStorage.setItem('svgs', JSON.stringify(db.svgs));
}

// همگام‌سازی ابری با GitHub API
async function syncWithGitHub() {
  if (!ghConfig.repo || !ghConfig.token) return;
  toast('در حال همگام‌سازی با گیت‌هاب...');
  try {
    const url = `https://api.github.com/repos/${ghConfig.repo}/contents/data.json`;
    const res = await fetch(url, {
      headers: { Authorization: `Bearer ${ghConfig.token}` }
    });
    if (res.ok) {
      const data = await res.json();
      fileSha = data.sha;
      const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      db = content;
      saveLocal();
      render();
    }
  } catch (e) {
    console.error(e);
  }
}

async function pushToGitHub() {
  saveLocal();
  if (!ghConfig.repo || !ghConfig.token) return;
  try {
    toast('در حال ذخیره روی ریپازیتوری...');
    const url = `https://api.github.com/repos/${ghConfig.repo}/contents/data.json`;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2))));
    
    const body = {
      message: 'Update SVG Vault Database',
      content: content,
      sha: fileSha || undefined
    };

    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${ghConfig.token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      const resData = await res.json();
      fileSha = resData.content.sha;
      toast('اطلاعات با موفقیت در گیت‌هاب ذخیره شد! 🎉');
    }
  } catch (e) {
    toast('خطا در ذخیره ابری گیت‌هاب!');
  }
}

// رندر داشبورد (دسته‌بندی‌ها)
function renderDashboard() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="panel">
      <h3>داشبورد دسته‌بندی‌ها</h3>
      <div style="display:flex; gap:8px">
        <input class="input" id="newCatInput" placeholder="نام دسته جدید..." />
        <button class="btn primary" id="btnAddCatBtn">افزودن دسته</button>
      </div>
      <div class="grid cols-3" style="margin-top:15px">
        ${db.categories.map(c => `
          <div class="card">
            <h4>${c}</h4>
            <div style="color:var(--muted); font-size:12px; margin-bottom:8px">
              تعداد: ${db.svgs.filter(s => s.cat === c).length} آیکون
            </div>
            <div style="display:flex; gap:6px">
              <a class="btn" href="#/vault?cat=${encodeURIComponent(c)}">مشاهده</a>
              ${c !== 'عمومی' ? `<button class="btn danger" onclick="deleteCategory('${c}')">حذف</button>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  document.getElementById('btnAddCatBtn').onclick = () => {
    const val = document.getElementById('newCatInput').value.trim();
    if (val && !db.categories.includes(val)) {
      db.categories.push(val);
      pushToGitHub();
      render();
    }
  };
}

// رندر صفحه ولت (SVGها)
function renderVault() {
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.hash.split('?')[1]);
  const activeCat = params.get('cat') || '';

  const list = activeCat ? db.svgs.filter(s => s.cat === activeCat) : db.svgs;

  app.innerHTML = `
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <h3>${activeCat ? `دسته: ${activeCat}` : 'همه SVGها'}</h3>
        <span class="tag">${list.length} آیکون</span>
      </div>
      <div class="grid cols-4" style="margin-top:15px">
        ${list.map((s, idx) => `
          <div class="card">
            <div class="thumb">${s.code}</div>
            <div style="font-weight:bold; font-size:13px; margin-bottom:4px">${s.name}</div>
            <div style="margin-bottom:8px"><span class="tag">${s.cat}</span></div>
            <div style="display:flex; gap:6px">
              <button class="btn primary" style="flex:1" onclick="copySvg(${s.id})">کپی کد</button>
              <button class="btn danger" onclick="deleteSvg(${s.id})">حذف</button>
            </div>
          </div>
        `).join('')}
      </div>
      ${list.length === 0 ? '<div style="color:var(--muted); margin-top:10px">هیچ آیکونی اینجا نیست!</div>' : ''}
    </div>
  `;
}

window.copySvg = (id) => {
  const item = db.svgs.find(s => s.id === id);
  if (item) {
    navigator.clipboard.writeText(item.code);
    toast('کد SVG در کلیپ‌بورد کپی شد! 📋');
  }
};

window.deleteSvg = (id) => {
  if (confirm('حذف شود؟')) {
    db.svgs = db.svgs.filter(s => s.id !== id);
    pushToGitHub();
    render) s.cat = 'عمومی'; });
    pushToGitHub();
    render();
  }
سته ${catName} حذف شود؟ آیکون‌هایش به "عمومی" منتقل می‌شوند.`)) {
    db.categories = db.categories.filter(c => c !== catName);
    db.svgs.forEach(s => { if(s.cat === catName) s.cat = 'عمومی'; });
    pushToGitHub();
    render();
  }
};

function render() {
  const hash = location.hash || '#/dashboard';
  if (hash.startsWith('#/vault')) renderVault();
  else renderDashboard();
}

// ثبت آیکون جدید
document.getElementById('btnOpenAdd').onclick = () => {
  const sel = document.getElementById('addCategory');
  sel.innerHTML = db.categories.map(c => `<option value="${c}">${c}</option>`).join('');
  toggleModal('addModal', true);
};

document.getElementById('btnSaveSvg').onclick = () => {
  const name = document.getElementById('addName').value.trim();
  const cat = document.getElementById('addCategory').value;
  const code = document.getElementById('addCode').value.trim();

  if (!name || !code.includes('<svg')) {
    alert('لطفاً نام و کد معتبر SVG وارد کنید');
    return;
  }

  db.svgs.unshift({ id: Date.now(), name, cat, code });
  pushToGitHub();
  toggleModal('addModal', false);
  document.getElementById('addName').value = '';
  document.getElementById('addCode').value = '';
  render();
};

// تنظیمات گیت‌هاب
document.getElementById('btnSettings').onclick = () => {
  document.getElementById('ghRepo').value = ghConfig.repo;
  document.getElementById('ghToken').value = ghConfig.token;
  toggleModal('settingsModal', true);
};

document.getElementById('btnSaveSettings').onclick = () => {
  ghConfig.repo = document.getElementById('ghRepo').value.trim();
  ghConfig.token = document.getElementById('ghToken').value.trim();
  localStorage.setItem('gh_config', JSON.stringify(ghConfig));
  toggleModal('settingsModal', false);
  syncWithGitHub();
};

// PWA Service Worker (برای قابلیت نصب روی گوشی)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGZ1bmN0aW9uKGV2ZW50KSB7fSk7');
}

window.addEventListener('hashchange', render);
syncWithGitHub();
render();
</script>
</body>
</html>
