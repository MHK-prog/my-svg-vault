<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Svg Vault</title>
  <style>
    :root{
      --bg:#07050b;
      --panel:#0e0a16;
      --card:#120b1f;
      --stroke:rgba(255,255,255,.14);
      --text:#f2ecff;
      --muted:rgba(242,236,255,.7);
      --purple:#8b5cff;
      --purple2:#5b2cff;
      --radius:14px;
      --gap:12px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
      background: radial-gradient(1200px 600px at 30% -10%, rgba(139,92,255,.35), transparent 55%),
                  radial-gradient(1000px 500px at 100% 0%, rgba(91,44,255,.25), transparent 60%),
                  var(--bg);
      color:var(--text);
    }

    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    header{
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(7,5,11,.72);
      border-bottom: 1px solid var(--stroke);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 16px;
    }

    .field{
      display:flex; align-items:center; gap:10px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 8px 12px;
      min-height: 40px;
    }

    .field input{
      all: unset;
      width: 220px;
      color: var(--text);
      font-size: 14px;
    }
    .field input::placeholder{color: rgba(242,236,255,.45)}

    .icon-btn{
      width:44px;height:44px;
      display:grid;place-items:center;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.2);
      background: linear-gradient(180deg, rgba(139,92,255,.18), rgba(91,44,255,.08));
      cursor:pointer;
    }
    .icon-btn:hover{border-color: rgba(255,255,255,.35)}
    .icon-btn:active{transform: translateY(1px)}

    /* + icon (thick white outline, no fill inside) */
    .plus svg{width:22px;height:22px}
    .plus rect, .plus line{
      stroke: #fff;
      stroke-width: 3.5;
      stroke-linecap: round;
      fill: none;
    }

    .panel{
      background: rgba(14,10,22,.55);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 14px;
      margin-top: 14px;
    }

    /* Category button */
    .cat-btn{
      width: 100%;
      height: 30px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor: pointer;
      padding: 0 12px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .cat-btn:hover{border-color: rgba(139,92,255,.6)}
    .cat-btn .name{font-size: 13px}
    .cat-btn .count{font-size: 12px; color: var(--muted)}

    .stack{display:flex;flex-direction:column;gap:10px}

    /* Vault grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)); /* mobile [][] */
      gap: 12px;
    }
    @media (min-width: 720px){
      .grid{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px){
      .grid{ grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }

    .svg-card{
      background: rgba(18,11,31,.7);
      border:1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 10px;
      min-height: 110px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .thumb{
      flex:1;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.03);
      border:1px dashed rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 12px;
    }
    .thumb svg{max-width: 48px; max-height: 48px}

    .row{
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      color: var(--muted);
      font-size: 12px;
    }

    .ghost{
      background: transparent;
      border:1px solid rgba(255,255,255,.18);
      color: var(--text);
      border-radius: 10px;
      height: 32px;
      padding: 0 10px;
      cursor: pointer;
    }

    .title{
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65vw;
    }

    /* Simple prompt overlay */
    .overlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.6);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index: 50;
    }
    .overlay.show{display:flex}
    .dialog{
      width:min(560px, 100%);
      background: rgba(14,10,22,.95);
      border:1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      padding: 14px;
    }
    .dialog textarea{
      width:100%; height: 160px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      color: var(--text);
      padding: 10px;
      outline:none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      margin-top: 10px;
    }
    .dialog .actions{display:flex; gap:10px; justify-content:flex-end; margin-top: 10px}
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar" id="topbar"></div>
  </header>

  <main class="wrap" id="app"></main>

  <!-- Add SVG dialog -->
  <div class="overlay" id="overlay">
    <div class="dialog">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div style="font-weight:800">افزودن SVG</div>
        <button class="ghost" id="btnClose">بستن</button>
      </div>
      <div style="display:grid;grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px">
        <input id="svgName" placeholder="نام (مثلاً user)" style="all:unset;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px;color:var(--text)" />
        <input id="svgColor" placeholder="اختیاری: رنگ (مثلاً #fff)" style="all:unset;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px;color:var(--text)" />
      </div>
      <textarea id="svgCode" placeholder="<svg ...>...</svg>"></textarea>
      <div class="actions">
        <button class="ghost" id="btnSaveSvg">ذخیره</button>
      </div>
    </div>
  </div>

<script>
  // --- KISS state ---
  const storeKey = 'svg_vault_v2';
  const state = load() || {
    siteName: 'My Svg Vault',
    categories: [
      { id: uid(), name: 'عمومی' }
    ],
    svgs: [
      // sample
      { id: uid(), catId: null, name: 'plus-outline', code: plusSvg() }
    ]
  };

  // If first category exists, bind sample to it
  if (state.categories[0] && !state.svgs[0].catId) state.svgs[0].catId = state.categories[0].id;

  let route = parseRoute(); // {view:'dashboard'} or {view:'category', id}
  let overlayOpen = false;

  // --- helpers ---
  function uid(){ return Math.random().toString(16).slice(2) + Date.now().toString(16); }
  function $(id){ return document.getElementById(id); }

  function load(){
    try { return JSON.parse(localStorage.getItem(storeKey)); }
    catch { return null; }
  }
  function save(){
    localStorage.setItem(storeKey, JSON.stringify(state));
  }

  function parseRoute(){
    const hash = location.hash || '#/';
    const parts = hash.replace('#','').split('/').filter(Boolean);
    if (parts[0] === 'c' && parts[1]) return { view:'category', id: parts[1] };
    return { view:'dashboard' };
  }

  function goDashboard(){ location.hash = '#/'; }
  function goCategory(id){ location.hash = `#/c/${id}`; }

  function plusSvg(){
    // thick white outline, no fill
    return `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect>
        <line x1="12" y1="7.5" x2="12" y2="16.5"></line>
        <line x1="7.5" y1="12" x2="16.5" y2="12"></line>
      </svg>
    `.trim();
  }

  function openOverlay(open){
    overlayOpen = open;
    $('overlay').classList.toggle('show', open);
    if(open){
      $('svgName').value = '';
      $('svgColor').value = '';
      $('svgCode').value = '';
      setTimeout(()=> $('svgName').focus(), 50);
    }
  }

  function currentCategory(){
    return state.categories.find(c => c.id === route.id);
  }

  // --- render ---
  function renderTopbar(){
    const top = $('topbar');
    top.innerHTML = '';

    if(route.view === 'dashboard'){
      // right: site name input
      const right = document.createElement('div');
      right.className = 'field';
      right.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="opacity:.9">
          <path fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" d="M4 7h16M4 12h10M4 17h16"/>
        </svg>
        <input id="siteNameInput" placeholder="اسم سایت" />
      `;

      // left: add category input + button
      const left = document.createElement('div');
      left.className = 'field';
      left.innerHTML = `
        <input id="newCatInput" placeholder="دسته جدید..." />
        <button class="icon-btn plus" id="btnAddCat" title="افزودن دسته">
          ${plusSvg()}
        </button>
      `;

      top.appendChild(right);
      top.appendChild(left);

      const siteInput = $('siteNameInput');
      siteInput.value = state.siteName;
      siteInput.oninput = () => {
        state.siteName = siteInput.value || 'My Svg Vault';
        document.title = state.siteName;
        save();
      };

      $('btnAddCat').onclick = () => {
        const val = $('newCatInput').value.trim();
        if(!val) return;
        const exists = state.categories.some(c => c.name === val);
        if(exists) return;
        const cat = { id: uid(), name: val };
        state.categories.unshift(cat);
        $('newCatInput').value = '';
        save();
        render();
      };

      return;
    }

    if(route.view === 'category'){
      const cat = currentCategory();
      const right = document.createElement('div');
      right.className = 'field';
      right.style.gap = '8px';
      right.innerHTML = `
        <button class="ghost" id="btnBack" title="بازگشت">↩</button>
        <div class="title">${cat ? cat.name : 'دسته'}</div>
      `;

      const left = document.createElement('div');
      left.className = 'field';
      left.innerHTML = `
        <button class="icon-btn plus" id="btnAddSvg" title="افزودن SVG">
          ${plusSvg()}
        </button>
      `;

      top.appendChild(right);
      top.appendChild(left);

      $('btnBack').onclick = goDashboard;
      $('btnAddSvg').onclick = () => openOverlay(true);
    }
  }

  function renderDashboard(){
    const app = $('app');
    app.innerHTML = `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
          <div style="font-weight:900">${state.siteName}</div>
          <div style="color:var(--muted);font-size:12px">${state.categories.length} دسته</div>
        </div>

        <div class="stack" id="catStack"></div>
      </div>
    `;

    const stack = document.getElementById('catStack');

    state.categories.forEach(cat => {
      const count = state.svgs.filter(s => s.catId === cat.id).length;

      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.innerHTML = `
        <span class="name">${cat.name}</span>
        <span class="count">${count}</span>
      `;
      btn.onclick = () => goCategory(cat.id);

      stack.appendChild(btn);
    });
  }

  function renderCategory(){
    const app = $('app');
    const cat = currentCategory();
    if(!cat){
      app.innerHTML = `<div class="panel">این دسته وجود ندارد. <button class="ghost" onclick="location.hash='#/'">بازگشت</button></div>`;
      return;
    }

    const list = state.svgs.filter(s => s.catId === cat.id);

    app.innerHTML = `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
          <div style="font-weight:900">SVGها</div>
          <div style="color:var(--muted);font-size:12px">${list.length} مورد</div>
        </div>

        <div class="grid" id="svgGrid"></div>
      </div>
    `;

    const grid = document.getElementById('svgGrid');

    list.forEach(item => {
      const card = document.createElement('div');
      card.className = 'svg-card';

      // show svg safely-ish: assume user inputs valid svg
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.innerHTML = item.code;

      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <span>${item.name || 'svg'}</span>
        <button class="ghost" title="کپی کد">Copy</button>
      `;

      row.querySelector('button').onclick = async () => {
        try{
          await navigator.clipboard.writeText(item.code);
        }catch{}
      };

      card.appendChild(thumb);
      card.appendChild(row);
      grid.appendChild(card);
    });
  }

  function render(){
    route = parseRoute();
    renderTopbar();
    if(route.view === 'dashboard') renderDashboard();
    else renderCategory();
  }

  // --- add svg handlers ---
  $('btnClose').onclick = () => openOverlay(false);
  $('overlay').onclick = (e) => { if(e.target.id === 'overlay') openOverlay(false); };

  $('btnSaveSvg').onclick = () => {
    const cat = currentCategory();
    if(!cat) return;

    const name = $('svgName').value.trim();
    const codeRaw = $('svgCode').value.trim();
    if(!codeRaw || !codeRaw.includes('<svg')) return;

    let code = codeRaw;

    // Optional: set color quickly (super KISS)
    const color = $('svgColor').value.trim();
    if(color){
      // adds style="color: ..." so currentColor works
      if(!code.includes('style=')){
        code = code.replace('<svg', `<svg style="color:${color}"`);
      }
    }

    state.svgs.unshift({ id: uid(), catId: cat.id, name: name || 'svg', code });
    save();
    openOverlay(false);
    render();
  };

  // --- init ---
  window.addEventListener('hashchange', render);
  document.title = state.siteName;
  render();
</script>
</body>
</html>
